# golangci-lint v2 config. CI pins the exact linter version (see .github/workflows/ci.yml)
# so a new upstream release can't turn the build red on its own.
version: "2"

linters:
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - learning-demos
      - test-endpoints
