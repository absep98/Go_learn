# CI = Continuous Integration
# Every time you push to main (or open a pull request), GitHub runs this file
# automatically on a fresh Linux VM. If any step fails, GitHub shows a red X
# on the commit so you know immediately something is broken.
name: CI

on:
  # Run on every push to main branch
  push:
    branches: [main]
  # Also run when a pull request targets main (before merging)
  pull_request:
    branches: [main]

jobs:
  test:
    # GitHub spins up a fresh Ubuntu VM for this job
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dbname
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5s

    # All steps run from inside the backend directory.
    # The backend has its own go.mod so Go commands must run from there.
    defaults:
      run:
        working-directory: Project-Building-While-Learning/personal-analytics-backend

    steps:
      # Step 1: Download your repo code onto the VM
      - uses: actions/checkout@v4

      # Step 2: Install Go 1.22 on the VM (it doesn't have it by default)
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache-dependency-path: Project-Building-While-Learning/personal-analytics-backend/go.sum

      # Step 3: Check the code compiles without errors
      # ./cmd/... = entry point (main.go), ./internal/... = all business logic
      # learning-demos/ and test-endpoints/ are excluded — they are standalone
      # demo scripts, not part of the application, and would cause build errors.
      - name: Build
        run: go build ./cmd/... ./internal/...

      # Step 4: Static analysis — catches bugs that compile fine but are wrong
      # Examples: wrong printf format verbs, mutex copied by value, redundant newlines
      - name: Vet
        run: go vet ./cmd/... ./internal/...

      # Step 5: Run all *_test.go files and confirm every Test* function passes
      - name: Test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: dbname
        run: go test ./cmd/... ./internal/...

      # Step 6: golangci-lint — runs 100+ linters in one tool
      # Catches: unused variables, error return values ignored, code style issues,
      # security anti-patterns, and much more — beyond what go vet alone catches.
      # Uses the official action which caches the lint binary for speed.
      # 'continue-on-error: true' means lint warnings won't fail the whole pipeline —
      # useful while learning; set to false on production repos to enforce clean code.
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: Project-Building-While-Learning/personal-analytics-backend
        continue-on-error: true
